# xmbwave configuration
#
# Loaded from $XDG_CONFIG_HOME/xmbwave/xmbwave.conf (or ~/.config/xmbwave/...)
# unless --config is given. Any key can be overridden per run:
#   xmbwave --set speed=0.4 --set colorTop=0.2,0.3,0.7
# Lines use "key = value"; '#' starts a comment.

fps            = 60      # target frames per second (ignored when vsync = 1)
vsync          = 0       # 1 = block on vblank, 0 = pace in software
msaa           = 4       # multisample count; the wave edges need this (0 = off)

# CPU displacement grid handed to the GPU. 256x96 is plenty for a 16:9 screen.
gridW          = 256
gridH          = 96

speed          = 1.0     # global time multiplier
amplitude      = 1.0     # overall displacement gain
tension        = 0.12    # reference `tension`
detail         = 4.5     # value-noise frequency (the kernel stand-in)
ribbonScale    = 0.5     # reference `waveHeightScale`
softClip       = 0.22    # reference `waveSoftClip`
zDetailScale   = 0.08    # reference `zDetailScale`
brightness     = 0.98    # crest glow multiplier
opacity        = 0.7     # overall ribbon alpha
fresnelPower   = 4.0     # reference `fresnelPower`
fresnelScale   = 0.5     # reference `fresnelScale`
waveBody       = 0.0     # flat-area luminance of the curtain (0 = crease only)

# Defaults match the reference XMB gradient: dark at the top, bright below.
colorTop       = 0.00,0.01,0.37
colorBot       = 0.10,0.61,0.82
waveColor      = 0.26,0.52,0.74   # tint of the wave strands
gradientAngle  = 15.1      # degrees from vertical; the reference gradient is tilted

particles       = 220    # 0 disables the layer
particleOpacity = 0.55
particleSize    = 1.5    # base point size in pixels
particleSizeVar = 4.0    # extra size, biased toward small sparkles
particleSpeed   = 1.0    # relative to the wave speed

# 1: only animate the monitor that currently has focus, and stop entirely while
# a fullscreen window covers it. 0: always animate.
pauseUnfocused = 1
# 1: animate every monitor except one hidden behind a fullscreen window.
allMonitors    = 0
focusPollMs    = 250

logLevel       = 2       # 0=error 1=warn 2=info 3=debug

# Pure black background, neutral white wave and sparkles. The default waveBody
# already gives the ribbon a visible curtain, so no extra tuning is needed.
#   colorTop        = 0,0,0
#   colorBot        = 0,0,0
#   waveColor       = 1,1,1
